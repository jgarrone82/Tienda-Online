# Dependabot security updates only, grouped into one pull request per workspace.
# `open-pull-requests-limit: 0` disables version updates; security updates still run.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/front-end-react"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      front-end-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      root-security:
        applies-to: security-updates
        patterns:
          - "*"
